<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Arena Craque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Baloo+2:wght@500;600;700;800&family=Lexend:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: estádio à noite — HUD fixo no topo, arena central em cartões grandes, barra de navegação tipo controle embaixo. Tema único escuro, escolhido de propósito. */
:root{
  color-scheme: dark;
  --night:#0A1226; --panel:#111D3A; --panel2:#182850; --line:#29407A;
  --ink:#F1F5FF; --ink2:#AEBEE3; --ink3:#7A8DBA;
  --pitch:#27D07A; --pitch-d:#0F7A45; --gold:#FFC93C; --cyan:#3CC8FF; --warm:#FF9F43; --berry:#C77DFF;
  --ok:#27D07A; --soft:#FF9F43;
  --f-display:"Russo One", "Arial Black", Impact, sans-serif;
  --f-body:"Lexend", "Trebuchet MS", system-ui, sans-serif;
  --f-hud:"Chakra Petch", "Lexend", system-ui, sans-serif;
  --r:18px; --r-sm:12px;
  --nav-h:76px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  background-image:radial-gradient(1200px 500px at 50% -120px, #1B3270 0%, transparent 70%),
  repeating-linear-gradient(90deg, rgba(39,208,122,.035) 0 80px, transparent 80px 160px);
  background-attachment:fixed; overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--night)}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:0}
.wrap{max-width:940px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,18,38,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hud .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.hud .av{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:28px;background:var(--panel2);border:2px solid var(--gold);flex:none}
.hud .who{min-width:0;flex:1}
.hud .nm{font-family:var(--f-display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:4px;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pitch),var(--cyan));border-radius:99px;transition:width .6s}
.hud .lv{font-family:var(--f-hud);font-size:13px;color:var(--ink2);display:flex;gap:8px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-hud);font-weight:700;font-size:17px;padding:6px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.coin{color:var(--gold)} .pill.fire{color:var(--warm)}
.lock{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;color:var(--ink3);border:1px solid var(--line);flex:none}
@media (max-width:520px){ .pill{font-size:15px;padding:5px 9px} .hud .wrap{gap:8px} .pill.fire span.t{display:none} }

main{padding-block:18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(10,18,38,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding-block:8px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;font-size:12px;font-weight:600;color:var(--ink2);min-height:60px}
.nav button .ic{font-size:26px;line-height:1}
.nav button[aria-current="page"]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--pitch)}

/* Generic */
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.eyebrow{font-family:var(--f-hud);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.title{font-size:clamp(24px,5vw,34px)}
.muted{color:var(--ink2)}
.small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 22px;border-radius:16px;font-weight:700;font-size:18px;background:var(--panel2);border:2px solid var(--line);transition:transform .12s, background .2s}
.btn:active{transform:scale(.97)}
.btn.go{background:linear-gradient(180deg,#33E08A,#18A862);border-color:#5BF0A4;color:#04210F;box-shadow:0 6px 0 #0B5E34}
.btn.go:active{box-shadow:0 2px 0 #0B5E34;transform:translateY(4px)}
.btn.gold{background:linear-gradient(180deg,#FFD866,#F2AE12);border-color:#FFE59A;color:#2B1C00;box-shadow:0 6px 0 #9A6B00}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.wide{width:100%}
.spk{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:var(--cyan);color:#05223A;font-size:22px;flex:none;box-shadow:0 0 0 4px rgba(60,200,255,.18)}
.spk.lg{width:64px;height:64px;font-size:30px}
.k .w{border-radius:6px;transition:background .12s,color .12s;padding:0 1px}
.k .w.on{background:var(--gold);color:#1F1400}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:14px;font-weight:600}
.note{padding:12px 14px;border-radius:var(--r-sm);background:rgba(60,200,255,.08);border:1px dashed rgba(60,200,255,.4);color:var(--ink2);font-size:15px}
.warnnote{background:rgba(255,159,67,.08);border-color:rgba(255,159,67,.45)}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:stretch}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.pcard{position:relative;border-radius:24px;padding:18px;overflow:hidden;min-height:340px;display:flex;flex-direction:column;gap:10px;border:2px solid rgba(255,255,255,.18);max-width:320px;width:100%;justify-self:center}
.pcard::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);pointer-events:none}
.pcard .ovr{font-family:var(--f-display);font-size:54px;line-height:1}
.pcard .pos{font-family:var(--f-hud);font-weight:700;letter-spacing:.12em}
.me-av{display:inline-block;vertical-align:middle;line-height:0}
.me-av.head{width:40px;height:40px;border-radius:10px;overflow:hidden;background:#BFE4FF}
.me-av.head .chr,.me-av.row .chr{width:100%;height:100%}
.me-av.row{width:28px;height:28px;border-radius:50%;overflow:hidden;background:#BFE4FF}
.me-av.onpc{width:min(150px,48%);animation:bob 2.8s ease-in-out infinite}
.pcard .face:has(.me-av){filter:none}
.me-av.shop{width:56px}
.pcard .face{font-size:84px;text-align:center;line-height:1.1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.pcard .pn{font-family:var(--f-display);font-size:22px;text-align:center;border-top:1px solid rgba(255,255,255,.3);border-bottom:1px solid rgba(255,255,255,.3);padding:4px 0;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-family:var(--f-hud);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.attrs span b{display:inline-block;min-width:30px}
.k-base{background:linear-gradient(160deg,#1E3D8F,#0E1C46 70%);}
.k-neon{background:linear-gradient(160deg,#0E5D6E,#12123A 60%,#5A1D7A);}
.k-ouro{background:linear-gradient(160deg,#E7B53A,#8A5B0B 75%);color:#1F1400}
.k-fogo{background:linear-gradient(160deg,#F2652B,#7A1420 75%);}
.k-gelo{background:linear-gradient(160deg,#9DE6FF,#2D6EA8 75%);color:#071B33}
.k-galaxia{background:radial-gradient(circle at 30% 20%,#7B4DFF,#1A0B45 60%),#1A0B45;}
.k-gramado{background:repeating-linear-gradient(180deg,#1C9A57 0 28px,#168A4C 28px 56px);}
.missions{display:flex;flex-direction:column;gap:10px}
.mis{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--panel2);border:2px solid var(--line);text-align:left;width:100%}
.mis .mi{font-size:34px;width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:var(--night);flex:none}
.mis .mt{flex:1;min-width:0}
.mis .mt b{display:block;font-size:18px}
.mis .prog{height:8px;border-radius:9px;background:var(--night);margin-top:6px;overflow:hidden}
.mis .prog i{display:block;height:100%;background:var(--pitch)}
.mis.done{border-color:var(--pitch);background:linear-gradient(90deg,rgba(39,208,122,.15),var(--panel2))}
.mis .ck{font-size:26px}
.chest{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;border:2px dashed var(--gold);background:rgba(255,201,60,.07)}
.chest .ci{font-size:40px}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px 10px;border-radius:20px;background:var(--panel);border:2px solid var(--line);min-height:150px;position:relative;transition:transform .12s,border-color .2s}
.tile:hover{border-color:var(--cyan)}
.tile:active{transform:scale(.97)}
.tile .ti{font-size:50px;line-height:1}
.tile .tn{font-weight:700;font-size:17px;text-align:center}
.tile .tl{font-family:var(--f-hud);font-size:13px;color:var(--ink3)}
.tile .stars{color:var(--gold);font-size:14px;letter-spacing:2px}

/* Quiz */
.quiz{display:flex;flex-direction:column;gap:16px;max-width:760px;margin:0 auto}
.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dots i{width:26px;height:10px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
.dots i.ok{background:var(--pitch);border-color:var(--pitch)}
.dots i.no{background:var(--soft);border-color:var(--soft)}
.dots i.cur{background:var(--cyan);border-color:var(--cyan)}
.qcard{background:var(--panel);border:2px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.qvis{font-size:clamp(46px,12vw,80px);line-height:1.15;word-break:break-word}
.qtext{font-size:clamp(20px,4.6vw,28px);font-weight:600;line-height:1.45;max-width:30ch}
.qbig{font-family:var(--f-display);font-size:clamp(36px,10vw,64px);letter-spacing:.06em}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:460px){.opts:not(.three){grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;min-height:76px;padding:12px 16px;border-radius:18px;background:var(--panel2);border:3px solid var(--line);font-size:20px;font-weight:600;text-align:left;transition:transform .1s,border-color .15s,background .15s}
.opt .oe{font-size:34px;flex:none}
.opt .ot{min-width:0;overflow-wrap:anywhere}
.opt.letter{justify-content:center;font-family:var(--f-display);font-size:clamp(30px,8vw,46px);min-height:96px;letter-spacing:.05em}
.opt.sel{border-color:var(--cyan);background:#1C3A6E}
.opt.right{border-color:var(--pitch);background:rgba(39,208,122,.22)}
.opt.wrong{border-color:var(--soft);background:rgba(255,159,67,.12);opacity:.7}
.opt:active{transform:scale(.98)}
.fb{border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;font-size:19px}
.fb.ok{background:rgba(39,208,122,.14);border:2px solid var(--pitch)}
.fb.try{background:rgba(255,159,67,.12);border:2px solid var(--soft)}
.fb .fi{font-size:34px;line-height:1}
.fb .fx{flex:1;min-width:0}
.fb b{font-family:var(--f-display);font-weight:400;letter-spacing:.03em;display:block;font-size:22px}
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:84px}
.slot{min-width:84px;height:80px;border-radius:16px;border:3px dashed var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:34px;padding:0 10px}
.slot.full{border-style:solid;border-color:var(--pitch);background:rgba(39,208,122,.15)}
.syl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.syl span{font-family:var(--f-display);font-size:clamp(34px,9vw,54px);padding:6px 16px;border-radius:14px;background:var(--panel2);border:2px solid var(--line)}
.syl span.on{background:var(--gold);color:#1F1400;border-color:var(--gold)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.score{display:flex;justify-content:center;align-items:center;gap:18px;font-family:var(--f-display);font-size:clamp(48px,14vw,84px)}
.score small{font-size:16px;font-family:var(--f-hud);color:var(--ink3);display:block;text-align:center;letter-spacing:.12em}
.board{background:#06101F;border:3px solid var(--line);border-radius:20px;padding:18px;text-align:center}
.rew{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* Homework */
.drop{border:3px dashed var(--line);border-radius:24px;padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;background:var(--panel)}
.drop.over{border-color:var(--cyan);background:var(--panel2)}
.drop img{max-height:320px;border-radius:14px;border:2px solid var(--line)}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.steps button{padding:10px 14px;border-radius:14px;background:var(--panel);border:2px solid var(--line);font-weight:700;font-size:15px}
.steps button[aria-current="step"]{border-color:var(--gold);background:var(--panel2)}
.steps button.done{border-color:var(--pitch)}
.slide{background:var(--panel);border:2px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.slide .sv{font-size:clamp(48px,13vw,86px);line-height:1.2}
.slide .st{font-size:clamp(22px,5vw,30px)}
.slide .sf{font-size:clamp(19px,4.4vw,25px);line-height:1.6;max-width:34ch}
.loader{display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 10px;text-align:center}
.ball{font-size:64px;animation:bounce 1s infinite cubic-bezier(.3,0,.7,1)}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-40px) rotate(180deg)}}
.exstep{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--panel2);text-align:left}
.exstep .n{font-family:var(--f-display);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--cyan);color:#05223A;flex:none}
.exstep .k{flex:1;min-width:0;font-size:19px}
.ans{padding:14px;border-radius:14px;border:2px solid var(--gold);background:rgba(255,201,60,.08);text-align:left}

/* Trophies */
.subtabs{display:flex;gap:8px;flex-wrap:wrap}
.subtabs button{padding:10px 16px;border-radius:99px;border:2px solid var(--line);background:var(--panel);font-weight:700;font-size:16px}
.subtabs button[aria-current="true"]{border-color:var(--gold);color:var(--gold)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ach{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;border-radius:18px;background:var(--panel);border:2px solid var(--line);text-align:center}
.ach .ai{font-size:44px}
.ach.off{opacity:.42;filter:grayscale(1)}
.ach.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,60,.15)}
.ach b{font-size:15px}
.table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.table td,.table th{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}
.table th{font-family:var(--f-hud);font-size:13px;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase}
.table tr.me td{background:rgba(255,201,60,.12);font-weight:700}
.table td.pos{font-family:var(--f-display);width:48px}
.zone-up td.pos{color:var(--pitch)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px;border-radius:18px;background:var(--panel);border:2px solid var(--line);text-align:center}
.item .sw{width:72px;height:92px;border-radius:12px;border:2px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:40px}
.item.eq{border-color:var(--pitch)}

/* Guardian */
.gate{max-width:420px;margin:30px auto;text-align:center}
.pinrow{display:flex;gap:10px;justify-content:center;margin:14px 0}
.pinrow i{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink3)}
.pinrow i.f{background:var(--gold);border-color:var(--gold)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.keypad button{height:62px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-family:var(--f-hud);font-size:26px;font-weight:700}
.tiles4{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat .v{font-family:var(--f-hud);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:14px;color:var(--ink2)}
.hbar{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:10px;align-items:center;padding:6px 0;font-size:15px}
.hbar .tr{height:16px;border-radius:4px;background:var(--panel2);overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--cyan);border-radius:0 4px 4px 0}
.hbar .vv{font-family:var(--f-hud);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink2)}
@media (max-width:520px){.hbar{grid-template-columns:110px minmax(0,1fr) 80px;font-size:14px}}
.chartbox{overflow-x:auto}
.chartbox svg text{fill:var(--ink3);font-family:var(--f-hud);font-size:11px}
.form{display:grid;gap:14px}
.form label{display:grid;gap:6px;font-weight:600;font-size:15px}
input[type=text],input[type=number],select,textarea{background:var(--night);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;width:100%}
input[type=range]{width:100%;accent-color:var(--pitch)}
.switch{display:flex !important;grid-template-columns:none;align-items:center;justify-content:space-between;gap:12px}
.switch input{width:24px;height:24px;accent-color:var(--pitch)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel2);font-size:15px;min-width:0}
.li .lx{flex:1;min-width:0}
.li .lx b{display:block;overflow-wrap:anywhere}
.ai-out{white-space:pre-wrap;font-size:16px;line-height:1.6}

/* Overlays */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 80px);transform:translateX(-50%) translateY(-20px);z-index:60;background:var(--panel2);border:2px solid var(--gold);color:var(--ink);padding:12px 18px;border-radius:16px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;max-width:min(92vw,520px);text-align:center}

<script>
window.ARENA_CONFIG = {
  SUPABASE_URL: "https://SEU-PROJETO.supabase.co",
  SUPABASE_ANON_KEY: "COLE-AQUI-A-CHAVE-ANON-PUBLICA"

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* Ponte entre o app e o Supabase: banco compartilhado pelo link (?p=CODIGO) e IA pela Edge Function "claude". */
(function(){
  const C = window.ARENA_CONFIG || {};
  const configured = C.SUPABASE_URL && !/SEU-PROJETO/.test(C.SUPABASE_URL) && C.SUPABASE_ANON_KEY && !/COLE-AQUI/.test(C.SUPABASE_ANON_KEY);
  if(!configured || !window.supabase){ console.warn("Supabase não configurado: o progresso fica só neste aparelho."); window.claude = { use: async () => null }; return; }
  const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
  const LS = "arena-player-code";
  const params = new URLSearchParams(location.search);
  let code = params.get("p");
  try{ code = code || localStorage.getItem(LS); }catch(e){}

  const ready = (async () => {
    if(code){ const { data, error } = await sb.rpc("get_player", { p_code: code }); if(error) throw error; if(!data) code = null; }
    if(!code){ const { data, error } = await sb.rpc("create_player"); if(error) throw error; code = data; }
    try{ localStorage.setItem(LS, code); }catch(e){}
    if(params.get("p") !== code){ params.set("p", code); history.replaceState(null, "", location.pathname + "?" + params.toString() + location.hash); }
    window.ARENA_SHARE_URL = location.origin + location.pathname + "?p=" + code;
    return code;
  })();
  ready.catch(e => console.warn("Supabase indisponível:", e));

  const dbErr = e => ({ code: "unavailable", message: e?.message || String(e) });
  const db = {
    doc(){ return {
      async get(){ const c = await ready; const { data, error } = await sb.rpc("get_player", { p_code: c }); if(error) throw dbErr(error);
        const st = data && data.state; const exists = !!(st && Object.keys(st).length); return { exists, data: () => (exists ? st : undefined) }; },
      async set(obj){ const c = await ready; const { error } = await sb.rpc("save_player", { p_code: c, p_state: obj }); if(error) throw dbErr(error); }
    }; }
  };
  const user = { async id(){ await ready; return "compartilhado"; }, isOwner: () => true, canEdit: () => true, can: () => true };

  function fileToJpegB64(file){ return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const max = 1600; let { width: w, height: h } = img; const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h; const x = cv.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg", 0.85).split(",")[1]); };
    img.onerror = () => { URL.revokeObjectURL(url); rej({ code: "image_rejected", message: "Imagem inválida" }); };
    img.src = url; }); }

  async function call(input, opts = {}){
    const c = await ready.catch(() => { throw { code: "upstream_error", message: "Sem conexão com o Supabase" }; });
    const prompt = typeof input === "string" ? input : (input || []).map(m => m.content).join("\n\n");
    const list = opts.images ? Array.from(opts.images.length !== undefined ? opts.images : [opts.images]) : [];
    const images = []; for(const f of list.slice(0, 4)) images.push({ media_type: "image/jpeg", data: await fileToJpegB64(f) });
    let res;
    try{ res = await fetch(C.SUPABASE_URL + "/functions/v1/claude", { method: "POST", signal: opts.signal,
        headers: { "Content-Type": "application/json", apikey: C.SUPABASE_ANON_KEY, Authorization: "Bearer " + C.SUPABASE_ANON_KEY },
        body: JSON.stringify({ code: c, prompt, images, tier: opts.modelTier || "default" }) }); }
    catch(e){ if(opts.signal && opts.signal.aborted) throw { code: "cancelled", message: "Cancelado" }; throw { code: "upstream_error", message: String(e) }; }
    const j = await res.json().catch(() => ({}));
    if(!res.ok) throw { code: j.code || "upstream_error", message: j.message || res.statusText };
    if(opts.onText) try{ opts.onText({ text: j.text, delta: j.text }); }catch(e){}
    return { text: j.text, truncated: !!j.truncated, modelTierApplied: "default" };
  }
  function parseLoose(t){
    try{ return JSON.parse(t); }catch(e){}
    const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if(f){ try{ return JSON.parse(f[1]); }catch(e){} }
    const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
    if(a >= 0 && b > a){ try{ return JSON.parse(t.slice(a, b + 1)); }catch(e){} }
    throw { code: "invalid_json", message: "Resposta sem JSON", text: t };
  }
  const sample = (input, opts) => call(input, opts);
  sample.json = async (input, opts) => { const r = await call(typeof input === "string" ? input + "\n\nResponda somente com JSON válido, sem texto antes ou depois." : input, opts); return parseLoose(r.text); };
  sample.limits = async () => ({ maxPromptBytes: 262144, images: { maxCount: 4, maxInputBytes: 20000000, mediaTypes: ["image/jpeg","image/png","image/webp","image/gif"] } });

  window.claude = { use: async (name) => {
    try{ await ready; }catch(e){ return null; }
    return name === "db" ? db : name === "user" ? user : name === "sample" ? sample : null; } };
})();
</script>

const TTS = {ok:"speechSynthesis" in window, voice:null, voices:[], token:0};
/* Qualidade da voz: vozes neurais/naturais primeiro */
function voiceScore(v){ const n=v.name.toLowerCase(); let sc=0;
  if(/natural|neural/.test(n)) sc+=100; else if(/premium/.test(n)) sc+=95; else if(/enhanced|melhorad|aprimorad/.test(n)) sc+=85;
  else if(/online/.test(n)) sc+=80; else if(/google/.test(n)) sc+=60; else if(!v.localService) sc+=40;
  if(/francisca|thalita|antonio|luciana|camila|vitoria|vitória|donato|brenda|leticia|letícia/.test(n)) sc+=10;
  if(/pt[-_]br/i.test(v.lang)) sc+=20; if(/compact|espeak|robot/.test(n)) sc-=50; return sc; }
function voiceTier(v){ const s=voiceScore(v); return s>=100?"⭐ Muito natural":s>=75?"✅ Natural":s>=55?"🙂 Boa":"🤖 Básica"; }
function pickVoice(){ if(!TTS.ok) return; const all = speechSynthesis.getVoices();
  TTS.voices = all.filter(v=>/^pt/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));
  const want = state.settings.voice;
  TTS.voice = (want && TTS.voices.find(v=>v.name===want)) || TTS.voices[0] || null; }
if(TTS.ok){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function stopSpeak(){ TTS.token++; if(TTS.ok) speechSynthesis.cancel(); document.querySelectorAll(".w.on").forEach(s=>s.classList.remove("on")); }
function speak(text, el){
  text = cleanSay(text); if(!TTS.ok || !text) return Promise.resolve();
  stopSpeak(); const my = TTS.token;
  const chunks=[]; const re=/[^.!?;:]+[.!?;:]*\s*/g; let m; while((m=re.exec(text))) chunks.push({t:m[0], b:m.index}); if(!chunks.length) chunks.push({t:text,b:0});
  const spans = el ? [...el.querySelectorAll(".w")] : []; const offs = spans.map(s=>+s.dataset.o);
  const hl = idx => { let k=-1; for(let i=0;i<offs.length;i++){ if(offs[i]<=idx) k=i; else break; } spans.forEach((s,i)=>s.classList.toggle("on",i===k)); };
  return new Promise(res=>{
    let i=0;
    const done=()=>{ spans.forEach(s=>s.classList.remove("on")); res(); };
    const next=()=>{ if(my!==TTS.token) return res(); if(i>=chunks.length) return done();
      const ch=chunks[i++]; const lead = ch.t.length - ch.t.trimStart().length; const say = ch.t.trim(); if(!say) return next();
      const u = new SpeechSynthesisUtterance(say); u.lang = TTS.voice?.lang || "pt-BR"; if(TTS.voice) u.voice=TTS.voice;
      u.rate = state.settings.rate*ST().rate; u.pitch = ST().pitch;
      u.onboundary = e => { if(my!==TTS.token) return; if(e.name && e.name!=="word") return; hl(ch.b + lead + e.charIndex); };
      u.onstart = () => { if(spans.length) hl(ch.b+lead); };
      u.onend = next; u.onerror = next;
      speechSynthesis.speak(u);
    };
    setTimeout(next, 40);
  });
}
/* Texto com destaque palavra por palavra */
function kara(text, cls=""){
  const toks = String(text??"").split(/(\s+)/); let say="", html="";
  for(const tk of toks){ if(!tk) continue; if(/^\s+$/.test(tk)){ html+=" "; continue; }
    const c = cleanSay(tk); if(!c){ html+=esc(tk); continue; }
    if(say) say+=" "; html += `<span class="w" data-o="${say.length}">${esc(tk)}</span>`; say += c; }
  return `<div class="k ${cls}" data-say="${esc(say)}">${html}</div>`;
}
function sayEl(el){ if(!el) return Promise.resolve(); return speak(el.dataset.say || el.textContent, el); }

function tone(seq){ if(!state.settings.sfx) return; try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); const t0=AC.currentTime;
  seq.forEach(([f,st,du,type="sine",vol=.08])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(0,t0+st); g.gain.linearRampToValueAtTime(vol*(state.settings.calm?.6:1),t0+st+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+st+du);
    o.connect(g).connect(AC.destination); o.start(t0+st); o.stop(t0+st+du+.05); }); }catch(e){} }

function fxStep(){ const x=FX.c.getContext("2d"); x.clearRect(0,0,FX.c.width,FX.c.height);
  FX.p = FX.p.filter(p=>p.life-->0); for(const p of FX.p){ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.a+=p.va;

let QZ=null;
const STYLES = {
 calmo:{n:"Professor calmo", praise:["Golaço!","Mandou bem!","Que jogada!","Isso aí, craque!","Na gaveta!","Perfeito!"], retry:["Quase! Vamos tentar de novo.","Foi na trave! Tenta mais uma.","Boa tentativa! Escuta a dica."], open:[""], end:"Fim de jogo!", rate:1, pitch:1},
 locutor:{n:"Locutor de futebol", praise:["Gooool! Que golaço!","É dele! Que jogada!","Na gaveta! Sem chance pro goleiro!","Bola na rede! Que categoria!","Olha o que ele fez! Golaço!"], retry:["Na trave! Por pouco! Vamos de novo.","Raspou a trave! Escuta a dica do professor.","O goleiro defendeu! Mas o jogo continua."], open:["Bola rolando na Arena!","Começa a partida!","Apita o árbitro, bola em jogo!"], end:"Fiiim de jogo! Apita o árbitro!", rate:1.05, pitch:1.06}};
const ST = () => STYLES[state.settings.style] || STYLES.calmo;
function prepQ(q){ // normaliza
  if(q.type==="build"||q.type==="learn") return q;
  const opts = q.opts.map((o,i)=>({...splitEmoji(o), raw:o, right:i===q.a}));
  return {...q, opts: q.keep ? opts : shuffle(opts)}; }
function startQuiz(cfg){ QZ = {...cfg, qs:cfg.qs.map(prepQ), i:0, tries:0, sel:-1, res:[], phase:"ask", built:[], start:Date.now(), gotXP:0, gotCoins:0}; renderQuiz(true); }
function renderQuiz(sayNow){ const Z=QZ; if(!Z) return; const q=Z.qs[Z.i];
  const dots = Z.qs.map((_,i)=>`<i class="${i<Z.res.length?(Z.res[i]?"ok":"no"):i===Z.i?"cur":""}"></i>`).join("");
  let body="";
  if(q.type==="learn"){
    body = `<div class="qcard"><div class="eyebrow">Palavra nova</div><div class="qvis">${esc(q.vis)}</div>
      <div class="syl" id="sylrow">${q.syl.map(s=>`<span>${esc(s)}</span>`).join("")}</div>
      ${kara(q.say)}<button class="spk lg" data-act="learnSay" aria-label="Ouvir">🔊</button></div>
      <button class="btn go wide" data-act="qNext">Entendi ▶</button>`;
  } else if(q.type==="build"){
    const need=q.syl.length;
    body = `<div class="qcard"><div class="qvis">${esc(q.vis)}</div>${kara(q.say,"qtext")}<button class="spk" data-act="qReplay" aria-label="Ouvir de novo">🔊</button>
      <div class="slots">${Array.from({length:need},(_,i)=>`<div class="slot ${Z.built[i]?"full":""}">${esc(Z.built[i]||"")}</div>`).join("")}</div></div>
      <div class="opts three" id="tiles">${q.tiles.map((t,i)=>`<button class="opt letter" data-act="tile" data-arg="${i}" ${q.used?.[i]?"disabled style='opacity:.3'":""}>${esc(t)}</button>`).join("")}</div>
      ${Z.phase==="done"?fbHTML(true,q):`<button class="btn ghost" data-act="tileUndo">↩ Apagar</button>`}
      ${Z.phase==="done"?`<button class="btn go wide" data-act="qNext">Próxima ▶</button>`:""}`;
  } else {
    const letters = q.opts.every(o=>o.t.length<=3 && !o.e) || q.big;
    body = `<div class="qcard">${q.vis?`<div class="qvis" aria-hidden="true">${esc(q.vis)}</div>`:""}
      ${q.show?`<div class="qbig">${q.show}</div>`:""}
      ${kara(q.q||q.say,"qtext")}
      <div class="row" style="justify-content:center"><button class="spk lg" data-act="qReplay" aria-label="Ouvir pergunta">🔊</button>${q.read?`<button class="btn" data-act="sayRead">🔊 Ouvir a frase</button>`:""}</div></div>
      <div class="opts ${letters&&q.opts.length===3?"three":""}">${q.opts.map((o,i)=>{ const cls=[letters?"letter":"", Z.sel===i?"sel":"", o.wrong?"wrong":"", (Z.phase!=="ask"&&o.right)?"right":""].join(" ");
        return `<button class="opt ${cls}" data-act="opt" data-arg="${i}" ${o.wrong||Z.phase!=="ask"?"disabled":""}>${o.e?`<span class="oe">${esc(o.e)}</span>`:""}${o.t?`<span class="ot">${esc(o.t)}</span>`:""}</button>`; }).join("")}</div>
      ${Z.phase==="ask" && Z.tries>0 ? fbHTML(false,q) : ""}
      ${Z.phase!=="ask" ? fbHTML(Z.res[Z.res.length-1],q) : ""}
      ${Z.phase==="ask" ? `<button class="btn go wide" data-act="qConfirm" ${Z.sel<0?"disabled":""}>✔ Confirmar</button>` : `<button class="btn go wide" data-act="qNext">${Z.i+1<Z.qs.length?"Próxima ▶":"Ver placar 🏁"}</button>`}`;
  }
  $("#view").innerHTML = `<div class="quiz"><div class="qtop"><button class="btn ghost" data-act="qExit" style="min-height:44px;padding:8px 14px">✕ Sair</button><div class="dots" aria-label="Progresso">${dots}</div>${Z.chip?`<span class="chip">${Z.chip}</span>`:""}</div>${body}</div>`;
  if(sayNow){ if(q.type==="learn") learnSay(); else sayQ(); }
}
function sayQ(){ const Z=QZ, q=Z?.qs[Z.i]; if(!q) return; const run=()=>{ if(QZ!==Z) return; if(q.say && q.q && q.say!==q.q) speak(q.say); else sayFirst(".qcard .k"); };
  const op = (Z.i===0 && !Z.opened) ? pick(ST().open) : ""; Z.opened=true; if(op) speak(op).then(()=>{ if(QZ===Z && Z.i===0) run(); }); else run(); }
function fiH(em,ok){ return QZ?.cast ? `<span class="mini ${ok?"cheer":""}"><span class="actor">${charSVG(QZ.cast)}</span></span>` : `<span class="fi">${em}</span>`; }
function fbHTML(ok,q){ const right = q.opts?.find(o=>o.right);
  if(ok===true) return `<div class="fb ok">${fiH("⚽",true)}<div class="fx"><b>${esc(QZ.lastPraise||"Golaço!")}</b>${kara(q.exp||"")}</div><button class="spk" data-act="sayFb" aria-label="Ouvir">🔊</button></div>`;
  if(QZ.phase==="ask") return `<div class="fb try">${fiH("💡")}<div class="fx"><b>Dica</b>${kara(q.tip||"Escute a pergunta de novo com calma.")}</div><button class="spk" data-act="sayFb" aria-label="Ouvir">🔊</button></div>`;
  return `<div class="fb try">${fiH("📘")}<div class="fx"><b>Vamos aprender</b>${kara(`A resposta certa é: ${right?(right.t||right.raw):""}. ${q.exp||""}`)}</div><button class="spk" data-act="sayFb" aria-label="Ouvir">🔊</button></div>`; }
function qOpt(i){ const Z=QZ; if(Z.phase!=="ask") return; Z.sel=+i; SFX.tap(); const o=Z.qs[Z.i].opts[i];
  renderQuiz(false); speak(o.t || o.raw); }
function qConfirm(){ const Z=QZ, q=Z.qs[Z.i]; if(Z.sel<0) return; const o=q.opts[Z.sel];
  if(o.right){ const first = Z.tries===0; Z.res.push(first); Z.phase="done"; Z.lastPraise=pick(ST().praise);
    const xp = first?10:5, cn = first?3:1; Z.gotXP+=xp; Z.gotCoins+=cn; addXP(xp); addCoins(cn);
    recordAnswer(Z.subj||q.subj, q.topic, first); SFX.ok(); celebrate(false); renderQuiz(false); renderHUDsoft();
    speak(Z.lastPraise+" "+(q.exp||""), $(".fb .k"));
  } else { o.wrong=true; Z.tries++; Z.sel=-1; SFX.soft();
    if(Z.tries>=2){ Z.res.push(false); Z.phase="done"; recordAnswer(Z.subj||q.subj, q.topic, false); renderQuiz(false); speak("Essa foi difícil. "+$(".fb .k").dataset.say, $(".fb .k")); }
    else { renderQuiz(false); const e=$(".fb .k"); speak(pick(ST().retry)+" Dica: "+e.dataset.say, e); } } }
function renderHUDsoft(){ renderHUD(); }
function qNext(){ const Z=QZ; const q=Z.qs[Z.i]; if(q.type==="learn"){ Z.res.push(true); }
  Z.i++; Z.tries=0; Z.sel=-1; Z.phase="ask"; Z.built=[];
  if(Z.i>=Z.qs.length) return finishQuiz(); renderQuiz(true); }
let LEARNSEQ=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function learnSay(){ const Z=QZ; if(!Z) return; const qi=Z.i, q=Z.qs[qi]; const seq=++LEARNSEQ;
  const spans=()=>[...document.querySelectorAll("#sylrow span")];
  const alive=()=>seq===LEARNSEQ && QZ===Z && Z.i===qi;
  for(let i=0;i<q.syl.length;i++){ if(!alive()) return; spans().forEach((s,j)=>s.classList.toggle("on",j===i)); await speak(sylSay(q.syl[i])); await wait(250); }
  if(!alive()) return; spans().forEach(s=>s.classList.add("on")); await speak(q.word.toLowerCase()+". "+q.say); spans().forEach(s=>s.classList.remove("on")); }
function sylSay(s){ return s.toLowerCase(); }
function tile(i){ const Z=QZ, q=Z.qs[Z.i]; if(Z.phase==="done") return; i=+i; q.used=q.used||[]; if(q.used[i]) return;
  const want=q.syl[Z.built.length], t=q.tiles[i];
  if(t===want){ Z.built.push(t); q.used[i]=true; SFX.tap(); speak(sylSay(t));
    if(Z.built.length===q.syl.length){ const first=Z.tries===0; Z.res.push(first); Z.phase="done"; Z.lastPraise=pick(ST().praise); q.exp=`Você montou ${q.word}: ${q.syl.join(" ")}.`;
      const xp=first?12:6, cn=first?3:1; Z.gotXP+=xp; Z.gotCoins+=cn; addXP(xp); addCoins(cn); recordAnswer(null,"Montar palavras",first); readStat(first);
      SFX.ok(); celebrate(false); renderQuiz(false); setTimeout(()=>speak(Z.lastPraise+" "+q.word.toLowerCase()+"!"),400); return; }
    renderQuiz(false);
  } else { Z.tries++; SFX.soft(); const el=document.querySelectorAll("#tiles .opt")[i]; el?.classList.add("shake"); speak(`Essa é ${sylSay(t)}. Procure ${sylSay(want)}.`); } }
function tileUndo(){ const Z=QZ, q=Z.qs[Z.i]; if(!Z.built.length) return; const last=Z.built.pop(); const idx=q.tiles.findIndex((t,i)=>t===last && q.used[i]); if(idx>=0) q.used[idx]=false; renderQuiz(false); }
function readStat(ok){ state.read.t++; if(ok) state.read.c++; }
function finishQuiz(){ const Z=QZ; const scored=Z.qs.filter(q=>q.type!=="learn").length; const res=Z.res.filter((r,i)=>Z.qs[i].type!=="learn");
  const c=res.filter(Boolean).length, w=scored-c, pct= scored? c/scored : 1;
  const stars = pct>=.9?3:pct>=.6?2:1; const bonus = 20 + (pct===1?10:0); addXP(bonus); addCoins(5+(pct===1?10:0)); Z.gotXP+=bonus; Z.gotCoins+=5+(pct===1?10:0);
  ensureDaily(); touchStreak(); commitTime();
  const secs = Math.round((Date.now()-Z.start)/1000);
  logSession({type:Z.kind, subj:Z.subj||null, topic:Z.topic||"", c, t:scored, secs});
  let lvlMsg="";
  if(Z.onDone) lvlMsg = Z.onDone({c,scored,pct}) || "";
  checkAch(); save(); renderHUD();
  const msg = `${ST().end} Placar: ${c} acertos e ${w} ${w===1?"erro":"erros"}. Você ganhou ${Z.gotXP} pontos de experiência e ${Z.gotCoins} moedas. ${pct===1?"Jogo perfeito!":pct>=.6?"Muito bem!":"Cada treino deixa você mais forte. Bora de novo?"} ${lvlMsg}`;
  $("#view").innerHTML = `<div class="quiz"><div class="board stack"><div class="eyebrow">Placar final</div>
    <div class="score"><div>${c}<small>ACERTOS</small></div><div style="color:var(--ink3)">×</div><div>${w}<small>ERROS</small></div></div>
    <div style="font-size:40px;letter-spacing:6px;color:var(--gold)">${"★".repeat(stars)}<span style="color:var(--line)">${"★".repeat(3-stars)}</span></div>
    <div class="rew"><span class="pill">✨ +${Z.gotXP} XP</span><span class="pill coin">🪙 +${Z.gotCoins}</span></div>
    ${kara(msg)}<button class="spk lg" data-act="sayFirstK" style="align-self:center" aria-label="Ouvir">🔊</button></div>
    <div class="grid2">${Z.again?`<button class="btn go" data-act="again">🔁 Jogar de novo</button>`:""}<button class="btn" data-act="tab" data-arg="${Z.back||"home"}">◀ Voltar</button></div></div>`;
  SFX.win(); celebrate(true); sayFirst(".board .k"); const again=Z.again; QZ = again?{again}:null; }

VIEWS.train = () => { const intro="Treino. Escolha uma matéria para treinar. Toque no desenho.";
  return `<div class="stack"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">Centro de treinamento</div><h1 class="title">Escolha a matéria</h1></div><button class="spk lg" data-act="sayIntro" aria-label="Ouvir">🔊</button></div>

function openSubj(k){ cur="train"; renderNav(); const s=SUBJ[k], st=state.subj[k]||{lvl:1}; const les = state.lessons.filter(l=>l.subj===k);
  $("#view").innerHTML = `<div class="stack" style="max-width:640px;margin:0 auto">

   <div class="slide"><div class="sv">${s.i}</div><h2 class="st">${s.n}</h2>${kara(`${s.n}. Nível ${st.lvl||1}. Escolha como quer treinar.`)}<button class="spk lg" data-act="sayFirstK" aria-label="Ouvir">🔊</button></div>
   <button class="btn go wide" data-act="trainBank" data-arg="${k}" data-label="Treino rápido">▶ Treino rápido · 5 perguntas</button>
   ${AI.sample?`<button class="btn wide" data-act="trainAI" data-arg="${k}" data-label="Treino novo">✨ Treino novo (perguntas criadas agora)</button>`:""}
   ${les.length && AI.sample?`<button class="btn gold wide" data-act="trainLesson" data-arg="${les[0].id}" data-label="Treino da escola">📚 Treino da escola: ${esc(les[0].tema)}</button>`:""}
  </div>`;
  sayFirst(".slide .k"); }
function bankQs(k, n=5){ const st=state.subj[k]||{lvl:1}; const cap=Math.min(st.lvl||1, state.settings.maxLvl);
  const pool = BANK[k].filter(r=>r[0]<=cap); const sel=[...shuffle(pool.filter(r=>r[0]===cap)), ...shuffle(pool.filter(r=>r[0]<cap))].slice(0,n);
  return shuffle(sel).map(r=>({topic:r[1], q:r[2], opts:r[3], a:0, tip:r[4], exp:r[5], vis:r[6]||"", subj:k})); }
const LVLNAMES = ["","bem fácil","fácil","médio","desafiador","avançado"];
const LVLDESC = {1:"bem fácil e concreto, com números pequenos",2:"fácil, conteúdo básico do ano",3:"médio, o básico do ano com um pouco de raciocínio",4:"desafiador, o conteúdo completo do ano, com duas etapas de raciocínio",5:"avançado, desafios um pouco além do ano, com várias etapas de raciocínio, mas explicados com clareza"};
function adaptLevel(k, pct){ const st = state.subj[k] = state.subj[k]||{lvl:1,c:0,t:0}; const old=st.lvl||1; const cap=Math.min(5,state.settings.maxLvl);
  if(pct>=.8){ st.good=(st.good||0)+1; const need = old>=3 ? 2 : 1; if(st.good>=need && old<cap){ st.lvl=old+1; st.good=0; } }
  else { st.good=0; if(pct<=.4) st.lvl=Math.max(1,old-1); }
  if(st.lvl>old) return `Você subiu para o nível ${st.lvl} em ${SUBJ[k].n}: ${LVLNAMES[st.lvl]}!`;
  if(old>=3 && pct>=.8 && old<cap) return `Mais um treino assim e você sobe para o nível ${old+1}!`;
  return ""; }
function trainDone(k){ return ({pct})=>{ ensureDaily(); state.daily.train++; return adaptLevel(k,pct); }; }
function trainBank(k){ startQuiz({kind:"treino", subj:k, chip:`${SUBJ[k].i} ${SUBJ[k].n}`, qs:bankQs(k), back:"train", again:()=>trainBank(k), onDone:trainDone(k)}); }
async function trainAI(k, lesson){ const st=state.subj[k]||{lvl:1}; const lv=Math.min(st.lvl||1,state.settings.maxLvl);
  const weak = state.topics.filter(t=>t.s===k && t.t>=2 && t.c/t.t<.6).map(t=>t.k).slice(0,4);
  const recent = state.lessons.filter(l=>l.subj===k).slice(0,2).map(l=>l.tema);
  loading("Criando treino novo...", "Estou montando perguntas especiais para você.");
  const prompt = `${CHILD_RULES()}
Crie 5 perguntas de múltipla escolha de ${SUBJ[k].n} para o ${state.ano}º ano do ensino fundamental.
Nível de dificuldade: ${lv} de 5, ou seja, ${LVLDESC[lv]}. Mesmo nos níveis altos, as frases continuam curtas e claras.
${lesson?`O treino deve ser parecido com a lição de casa sobre "${lesson.tema}". Resumo da lição: ${lesson.resumo||""}`:""}
${recent.length&&!lesson?`Temas recentes vistos na escola: ${recent.join("; ")}. Use-os em pelo menos 2 perguntas.`:""}
${weak.length?`Temas em que o aluno errou mais: ${weak.join("; ")}. Inclua 1 ou 2 perguntas de reforço sobre eles, bem simples.`:""}
Cada pergunta: até 20 palavras, 4 opções curtas (até 4 palavras cada; pode começar a opção com 1 emoji que ajude a reconhecer), só uma certa.
Responda SOMENTE com um JSON: [{"topic":"tema curto","q":"pergunta","opts":["opção certa","errada","errada","errada"],"a":0,"tip":"dica curta que ajuda a pensar sem dar a resposta","exp":"explicação de 1 ou 2 frases curtas do porquê","vis":"1 a 4 emojis que ilustram a pergunta, sem revelar a resposta"}]`;
  try{ const ctl=new AbortController(); LOADCTL=ctl;
    const arr = await AI.sample.json(prompt,{signal:ctl.signal, cache:false});
    const qs = validQs(arr, k); if(qs.length<3) throw {code:"invalid_json"};
    startQuiz({kind:lesson?"escola":"treino", subj:k, topic:lesson?.tema||"", chip:`${SUBJ[k].i} ${SUBJ[k].n}`, qs, back:"train", again:()=>trainAI(k,lesson), onDone:trainDone(k)});
  }catch(e){ if(e?.code==="cancelled") return go("train",true); errorBox(aiErr(e), `trainAI`, k, lesson?.id); }
}
function validQs(arr, k){ if(!Array.isArray(arr)) arr = arr?.treino || arr?.perguntas || []; return arr.filter(q=>q && typeof q.q==="string" && Array.isArray(q.opts) && q.opts.length>=2 && Number.isInteger(+q.a) && +q.a>=0 && +q.a<q.opts.length)
  .slice(0,8).map(q=>({topic:String(q.topic||q.tema||"Treino").slice(0,60), q:q.q, opts:q.opts.map(String).slice(0,4), a:Math.min(+q.a,3), tip:q.tip||q.dica||"", exp:q.exp||q.explicacao||"", vis:q.vis||q.visual||"", subj:k})); }

  <div class="slide"><div class="sv">🔤</div>${kara(`Hoje vamos treinar: ${L.d}. São 8 jogadas. Escute com atenção e toque na resposta.`)}<button class="spk lg" data-act="sayFirstK" aria-label="Ouvir">🔊</button></div>
  <button class="btn go wide" data-act="readStart" data-label="Começar">▶ Começar leitura do dia</button>
  ${state.daily.read>=1?`<div class="note">Missão de leitura de hoje concluída. Treinar mais ajuda muito!</div>`:""}</div>`; };
function wordOpts(w, n=3){ const others = shuffle(WORDS.filter(x=>x[0]!==w[0] && (x[0][0]===w[0][0] || Math.abs(x[0].length-w[0].length)<=1))).slice(0,n-1);
  while(others.length<n-1){ const r=pick(WORDS); if(r[0]!==w[0] && !others.includes(r)) others.push(r); } return others; }
function readItem(lvl){
  if(lvl===1){ const v=pick(VOW); const others=shuffle(VOW.filter(x=>x!==v)).slice(0,2); return {topic:"Vogais", say:`Toque na letra ${v}.`, q:"Ouça e toque na letra.", opts:[v,...others], a:0, big:true, tip:`Escute de novo: letra ${v}.`, exp:`Essa é a letra ${v}.`}; }
  if(lvl===2){ const w=pick(WORDS.filter(x=>x[0].length<=6)); const L=w[0][0]; const others=shuffle([...new Set(WORDS.map(x=>x[0][0]))].filter(x=>x!==L)).slice(0,2);
    return {topic:"Primeira letra", vis:w[2], say:`${w[0].toLowerCase()}. Com qual letra começa ${w[0].toLowerCase()}?`, q:"Com qual letra começa essa palavra?", opts:[L,...others], a:0, big:true, tip:`Fale devagar: ${w[1].split("-")[0].toLowerCase()}...`, exp:`${w[0]} começa com a letra ${L}.`}; }
  if(lvl===3){ const c=pick(FAM); const vs = c==="G"||c==="C" ? ["A","O","U"] : VOW; const v=pick(vs); const s=c+v; const others=shuffle(vs.filter(x=>x!==v)).slice(0,2).map(x=>c+x);
    return {topic:"Sílabas", say:`Toque na sílaba ${sylSay(s)}.`, q:"Ouça e toque na sílaba.", opts:[s,...others], a:0, big:true, tip:`Escute: ${sylSay(s)}. A letra ${c} junto com ${v}.`, exp:`${c} com ${v} faz ${s}.`}; }
  if(lvl===4){ const w=pick(WORDS); const others=wordOpts(w);
    return {topic:"Palavras", vis:w[2], say:`Qual destas palavras é ${w[0].toLowerCase()}?`, q:"Ache a palavra que você ouviu.", opts:[w[0],...others.map(o=>o[0])], a:0, big:true, tip:`${w[0].toLowerCase()} começa com a letra ${w[0][0]}.`, exp:`Essa é a palavra ${w[0]}: ${w[1]}.`}; }
  if(lvl===5){ const w=pick(WORDS.filter(x=>x[1].includes("-"))); const syl=w[1].split("-"); const extra = pick(["BA","TE","LU","MI","PO","CA","DA"].filter(x=>!syl.includes(x)));
    return {type:"build", word:w[0], syl, vis:w[2], tiles:shuffle([...syl,extra]), say:`Monte a palavra ${w[0].toLowerCase()}. Toque nas sílabas na ordem.`, q:""}; }
  const s=pick(SENT); return {topic:"Frases", show:esc(s[0]), read:s[0], say:"Leia a frase e toque no desenho certo. Se precisar, toque em ouvir a frase.", q:"Leia a frase e toque no desenho certo.", opts:[s[1],...s[2].slice(0,2)], a:0, big:true, tip:"Leia devagar. Toque em ouvir a frase se precisar.", exp:`A frase diz: ${s[0].toLowerCase()}`}; }
function readStart(){ const R=state.read; const lv=R.lvl; const qs=[];
  // aquecimento: palavra nova com sílabas
  const w=pick(WORDS.filter(x=>x[1].includes("-"))); qs.push({type:"learn", word:w[0], syl:w[1].split("-"), vis:w[2], say:`Essa é a palavra ${w[0].toLowerCase()}.`});
  for(let i=0;i<5;i++) qs.push(readItem(lv));
  for(let i=0;i<2;i++) qs.push(readItem(lv>1? Math.max(1,lv-1-(i%2)) : 1));
  startQuiz({kind:"leitura", subj:null, chip:"🔤 Leitura", qs:[qs[0],...shuffle(qs.slice(1))], back:"read", again:readStart,
    onDone:({pct})=>{ ensureDaily(); state.daily.read++; R.sets++; if(pct>=.8){ R.good++; } else R.good=0;
      let m=""; if(R.good>=2 && R.lvl<6){ R.lvl++; R.good=0; m=`Você passou para a fase ${R.lvl} da leitura: ${RLEVELS[R.lvl-1].n}!`; } else if(pct<.4 && R.lvl>1){ R.lvl--; R.good=0; m="Vamos treinar a fase anterior mais um pouco."; }
      return m; } });
  // estatística de leitura nas respostas normais
}

   <div class="ball">⚽</div><h2 class="lz-h">O time está lendo o seu caderno...</h2>${kara("Estamos lendo sua lição. Já já a aula começa!")}
   <div class="small">Pode levar até 1 minuto.</div><button class="btn" data-act="cancelLoad">✕ Cancelar</button></div>`; sayFirst(".lz .k"); }
async function hwAnalyze(){ if(!HW.file||!AI.sample) return; HW.note = $("#hwNote")?.value || HW.note;
  hwLoading();
  const prompt = `${CHILD_RULES()}

A imagem é a foto do caderno ou livro com a lição de casa de hoje. Leia todos os exercícios.
${HW.note?`Recado do responsável: ${HW.note}`:""}
A aula será apresentada por bonequinhos de futebol que conversam com o aluno em balões de fala, um balão por vez, com uma ilustração ao lado.
Personagens (use o id): "tecnico" (Professor Tático, apresenta e organiza), "goleiro" (Gui), "zagueiro" (Beto), "meia" (Lia), "atacante" (Rafa). Varie os personagens e os exemplos (futebol, videogame, comida, dinheiro, bichos).
REGRA MAIS IMPORTANTE: textos curtos. Cada "fala" tem NO MÁXIMO 2 frases e 20 palavras. Prefira mostrar na ilustração em vez de explicar com muitas palavras.
Cada cena pode ter uma "cena" (ilustração) de um destes tipos:
- {"tipo":"contagem","grupos":[{"emoji":"⚽","qtd":3},{"emoji":"⚽","qtd":2}],"operacao":"+","resultado":"5"}  (qtd até 12; operacao "+","-","x",":" ou "")
- {"tipo":"fracao","partes":4,"pintadas":1,"emoji":"🍕"}
- {"tipo":"reta","de":0,"ate":10,"marcar":[3,7],"saltos":[{"de":3,"para":7}]}
- {"tipo":"conta","a":"25","b":"17","op":"+","resultado":"42"}
- {"tipo":"palavra","palavra":"GOLEIRO","silabas":["GO","LEI","RO"],"destaque":1}
- {"tipo":"comparar","esquerda":"🍎🍎🍎","direita":"🍎🍎","sinal":">"}
- {"tipo":"placar","casa":3,"fora":1,"texto":"Placar final"}
- {"tipo":"emoji","emojis":"🌍☀️🌙","legenda":"até 4 palavras"}
Uma cena pode ter uma pergunta rápida: "checagem":{"pergunta":"até 12 palavras","opcoes":["certa","errada"],"certa":0}  (2 ou 3 opções curtas).
Responda SOMENTE com JSON:
{"legivel":true,"materia":"nome da matéria","tema":"até 5 palavras","resumo":"1 frase para o responsável sobre o que a lição pede","dica_responsavel":"1 frase",
 "abertura":{"personagem":"tecnico","fala":"a missão de hoje, até 20 palavras"},
 "aula":[{"personagem":"meia","fala":"...","cena":{...},"checagem":{...}}],
 "exercicios":[{"enunciado":"o exercício contado de forma simples, até 20 palavras","cena":{...},"passos":[{"personagem":"zagueiro","fala":"...","cena":{...}}],"checagem":{...},"resposta":"resposta curta","como_escrever":"o que escrever no caderno"}],
 "treino":[{"topic":"tema","q":"até 15 palavras","opts":["certa","errada","errada","errada"],"a":0,"tip":"dica curta","exp":"1 frase","vis":"1 a 3 emojis"}]}
Quantidades: "aula" com 3 ou 4 cenas (pelo menos 1 com checagem); todos os exercícios da foto (no máximo 6), cada um com 2 ou 3 passos; "treino" com 5 perguntas (opções de até 4 palavras).
Se não der para ler a foto: {"legivel":false,"problema":"o que fazer, em 1 frase"}.`;
  try{ const ctl=new AbortController(); LOADCTL=ctl;
    const L = await AI.sample.json(prompt,{images:[HW.file], signal:ctl.signal, cache:false});
    if(!L || L.legivel===false){ return errorBox((L&&L.problema)||"Não consegui ler a foto. Tire outra foto com mais luz, bem de perto.", null); }
    const lesson = normLesson(L); state.lessons.unshift(lesson); state.lessons = state.lessons.slice(0,15); save();
    openLessonObj(lesson);
  }catch(e){ if(e?.code==="cancelled") return go("hw",true); errorBox(aiErr(e), "hwAnalyze"); } }

/* ---- normalização ---- */
const castId = p => CAST[p] ? p : CAST_IDS.find(k=>String(p||"").toLowerCase().includes(k)) || null;
function splitFala(t){ t=String(t||"").trim(); if(!t) return []; const sents=t.match(/[^.!?]+[.!?]*/g)||[t]; const out=[]; let cur="";
  for(const s of sents.map(x=>x.trim()).filter(Boolean)){ const n=(cur+" "+s).trim(); if(cur && (n.length>130 || (cur.match(/[.!?]/g)||[]).length>=2)){ out.push(cur); cur=s; } else cur=n; }
  if(cur) out.push(cur); return out; }
function normCheck(c){ if(!c||!Array.isArray(c.opcoes)||c.opcoes.length<2) return null; const certa=+c.certa; if(!(certa>=0&&certa<c.opcoes.length)) return null;
  return {pergunta:String(c.pergunta||"Qual é a certa?"), opcoes:c.opcoes.slice(0,3).map(String), certa:Math.min(certa,2)}; }
function normScene(s, fallbackId, i){ const id=castId(s?.personagem)||fallbackId||CAST_IDS[i%CAST_IDS.length];
  const parts=splitFala(s?.fala); if(!parts.length) return [];
  return parts.map((f,j)=>({p:id, f, cena: j===parts.length-1 ? (s.cena||null) : (j===0 ? (s.cena||null) : null), chk: j===parts.length-1 ? normCheck(s.checagem) : null})); }
function normLesson(L){ const subj=subjKey(L.materia);
  const ab = normScene(L.abertura||{personagem:"tecnico",fala:L.missao||"Hoje a missão é aprender e resolver a lição."},"tecnico",0);
  const aula = (Array.isArray(L.aula)?L.aula:[]).slice(0,6).flatMap((s,i)=>normScene({personagem:s.personagem, fala:s.fala||[s.titulo,s.fala].filter(Boolean).join(". "), cena:s.cena||(s.visual?{tipo:"emoji",emojis:s.visual}:null), checagem:s.checagem}, null, i+2));
  const ex = (Array.isArray(L.exercicios)?L.exercicios:[]).slice(0,8).map((x,i)=>({enun:String(x.enunciado||""), cena:x.cena||null,
     passos:(Array.isArray(x.passos)?x.passos:[]).slice(0,6).flatMap((p,j)=>normScene(typeof p==="string"?{fala:p}:p, null, i+j+1)),
     chk:normCheck(x.checagem), resp:String(x.resposta||""), escrever:String(x.como_escrever||"")}));
  return {v:2, id:"l"+Date.now().toString(36), ts:Date.now(), subj, materia:String(L.materia||SUBJ[subj].n), tema:String(L.tema||"Lição de hoje").slice(0,60),
    resumo:String(L.resumo||""), dica:String(L.dica_responsavel||""), ab, aula, ex, treino:validQs(L.treino||[], subj), done:false, score:null}; }
function upgradeLesson(L){ if(L.v===2) return L;
  const n = normLesson({materia:L.materia, tema:L.tema, resumo:L.resumo, dica_responsavel:L.dica, abertura:{personagem:"tecnico",fala:L.missao},
    aula:(L.aula||[]).map(a=>({fala:a.fala, visual:a.visual})), exercicios:(L.ex||[]).map(x=>({enunciado:x.enunciado, passos:x.passos, resposta:x.resposta, como_escrever:x.escrever})), treino:[]});
  Object.assign(L, {v:2, ab:n.ab, aula:n.aula, ex:n.ex}); return L; }

/* ---- roteiro linear de cenas ---- */
const SECS = ["🎯 Missão","📖 Aula","🧩 Exercícios","⚽ Treino"];
function buildScript(L){ const S=[];
  L.ab.forEach(s=>S.push({...s, sec:0}));
  L.aula.forEach(s=>S.push({...s, sec:1}));
  L.ex.forEach((x,i)=>{ const tag=`Exercício ${i+1}`;
    S.push({sec:2, tag, p:"tecnico", f:`${tag}. ${x.enun}`, cena:x.cena});
    x.passos.forEach(s=>S.push({...s, sec:2, tag}));
    S.push({sec:2, tag, p: x.chk?"meia":"atacante", f: x.chk ? x.chk.pergunta : "Agora é sua vez! Tente responder. Depois toque em ver resposta.", chk:x.chk, reveal:true, resp:x.resp, escrever:x.escrever}); });
  if(!L.ex.length) S.push({sec:2, p:"zagueiro", f:"Não achei exercícios separados na foto. Vamos direto para o treino!"});
  S.push({sec:3, p:"atacante", f: L.treino.length ? `Agora é o treino! São ${L.treino.length} perguntas parecidas com a lição. Bora?` : "Agora é o treino! Toque em mais exercícios para criar perguntas novas.", treino:true});
  return S; }
function openLessonObj(l){ HW.lesson=upgradeLesson(l); HW.script=buildScript(HW.lesson); HW.pos=0; HW.chk={}; HW.rev={}; HW.count=0; HW.stage="lesson"; go("hw",true); sceneSpeak(); }

/* ---- ilustrações ---- */
const OPS = {"+":"➕","-":"➖","−":"➖","x":"✖️","×":"✖️","*":"✖️",":":"➗","÷":"➗","/":"➗"};
const num = (v,a,b,d) => { const n=Math.round(+v); return Number.isFinite(n) ? clamp(n,a,b) : d; };
function illus(c){ if(!c || typeof c!=="object") return ""; const t=String(c.tipo||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  try{ if(t==="contagem") return ilCount(c); if(t==="fracao") return ilFrac(c); if(t==="reta") return ilLine(c); if(t==="conta") return ilConta(c);
    if(t==="palavra") return ilWord(c); if(t==="comparar") return ilCmp(c); if(t==="placar") return ilScore(c); return ilEmoji(c); }catch(e){ return ilEmoji(c); } }
function ilEmoji(c){ const e=String(c.emojis||c.visual||c.emoji||""); if(!e && !c.legenda) return ""; return `<div class="il-emoji">${esc(e)}</div>${c.legenda?`<div class="il-cap">${esc(c.legenda)}</div>`:""}`; }
function revealBox(v){ return v===undefined||v===null||v==="" ? "" : `<span class="il-op">=</span><button class="il-res" data-act="ilReveal" data-arg="${esc(v)}">?</button>`; }
function ilCount(c){ const gs=(Array.isArray(c.grupos)?c.grupos:[]).slice(0,4); if(!gs.length) return ilEmoji(c); const op=OPS[String(c.operacao||"").trim()]||"";
  let k=0; const html = gs.map((g,i)=>{ const q=num(g.qtd,0,12,0); const e=splitEmoji(g.emoji||"⚽").e||"⚽";
    return `${i&&op?`<span class="il-op">${op}</span>`:""}<div class="il-grp">${Array.from({length:q},()=>`<button class="il-it" data-act="countIt" data-n="${++k}">${e}</button>`).join("")}${g.rotulo?`<span class="il-cap">${esc(g.rotulo)}</span>`:""}</div>`; }).join("");
  return `<div class="il-row">${html}${revealBox(c.resultado)}</div><div class="il-hint">Toque nos desenhos para contar</div>`; }
function ilFrac(c){ const n=num(c.partes,1,12,4), p=num(c.pintadas,0,n,1); const R=70, cx=80, cy=80; let s="";
  if(n===1) s=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="${p?"#E0262B":"#FFF3D6"}" stroke="#1C2A44" stroke-width="3"/>`;
  else for(let i=0;i<n;i++){ const a0=-Math.PI/2+i*2*Math.PI/n, a1=a0+2*Math.PI/n; const x0=cx+R*Math.cos(a0), y0=cy+R*Math.sin(a0), x1=cx+R*Math.cos(a1), y1=cy+R*Math.sin(a1);
    s+=`<path class="il-slice" d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${R},${R} 0 ${n<=2?0:0} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${i<p?"#E0262B":"#FFF3D6"}" stroke="#1C2A44" stroke-width="3"/>`; }
  return `<div class="il-row"><svg viewBox="0 0 160 160" width="170" height="170" role="img" aria-label="${p} de ${n} partes pintadas">${s}</svg>
   <div class="il-frac"><span>${p}</span><i></i><span>${n}</span><div class="il-cap">${c.emoji?esc(c.emoji)+" ":""}${p} de ${n} partes</div></div></div>`; }
function ilLine(c){ let a=num(c.de,-50,200,0), b=num(c.ate,-50,200,10); if(b<=a) b=a+10; if(b-a>30) b=a+30;
  const W=620, H=150, pl=30, pr=30, y=100, sx=v=>pl+(v-a)*(W-pl-pr)/(b-a); const step = (b-a)>15?2:1;
  let s=`<line x1="${pl-10}" x2="${W-pr+10}" y1="${y}" y2="${y}" stroke="#1C2A44" stroke-width="4" stroke-linecap="round"/>`;
  for(let v=a; v<=b; v++){ const big=(v-a)%step===0; s+=`<line x1="${sx(v)}" x2="${sx(v)}" y1="${y-(big?10:6)}" y2="${y+(big?10:6)}" stroke="#1C2A44" stroke-width="3"/>`; if(big) s+=`<text x="${sx(v)}" y="${y+34}" text-anchor="middle" font-size="20" font-weight="700" fill="#1C2A44">${v}</text>`; }
  (Array.isArray(c.saltos)?c.saltos:[]).slice(0,4).forEach(j=>{ const f=num(j.de,a,b,a), t=num(j.para,a,b,b); const x0=sx(f), x1=sx(t), mx=(x0+x1)/2, h=Math.min(70, 20+Math.abs(x1-x0)/3);
    s+=`<path d="M${x0},${y-12} Q${mx},${y-12-h*1.4} ${x1},${y-12}" fill="none" stroke="#2F7DF6" stroke-width="4" stroke-dasharray="8 6" class="il-jump"/><text x="${mx}" y="${y-12-h*.75}" text-anchor="middle" font-size="20" font-weight="800" fill="#2F7DF6">${t-f>0?"+":""}${t-f}</text>`; });
  (Array.isArray(c.marcar)?c.marcar:[]).slice(0,6).forEach(m=>{ const v=num(m,a,b,null); if(v===null) return; s+=`<text x="${sx(v)}" y="${y+9}" text-anchor="middle" font-size="26">⚽</text>`; });
  return `<div class="il-scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px" role="img" aria-label="Reta numérica de ${a} a ${b}">${s}</svg></div>`; }
function ilConta(c){ const op=String(c.op||"+").replace("*","×").replace("x","×").replace("/","÷").replace(":","÷");
  return `<div class="il-conta"><div>${esc(c.a??"")}</div><div><span class="il-cop">${esc(op)}</span>${esc(c.b??"")}</div><hr><button class="il-res wide" data-act="ilReveal" data-arg="${esc(c.resultado??"")}">?</button></div><div class="il-hint">Toque no ? para ver o resultado</div>`; }
function ilWord(c){ const w=String(c.palavra||"").toUpperCase(); const sy=(Array.isArray(c.silabas)&&c.silabas.length?c.silabas:[w]).map(x=>String(x).toUpperCase()); const d=+c.destaque;
  return `<div class="il-syl">${sy.map((x,i)=>`<button class="${i===d?"hl":""}" data-act="sayTxt" data-arg="${esc(x.toLowerCase())}">${esc(x)}</button>`).join("")}</div><button class="il-word" data-act="sayTxt" data-arg="${esc(w.toLowerCase())}">🔊 ${esc(w)}</button>`; }
function ilCmp(c){ const sig={">":"&gt;","<":"&lt;","=":"="}[String(c.sinal||"").trim()]||"?";
  return `<div class="il-row"><div class="il-box">${esc(c.esquerda??"")}</div><span class="il-sig">${sig}</span><div class="il-box">${esc(c.direita??"")}</div></div>`; }
function ilScore(c){ return `<div class="il-score"><div class="il-team">🏠<span>CASA</span></div><div class="il-nums">${num(c.casa,0,99,0)} <i>×</i> ${num(c.fora,0,99,0)}</div><div class="il-team">✈️<span>FORA</span></div></div>${c.texto?`<div class="il-cap">${esc(c.texto)}</div>`:""}`; }

/* ---- tela da cena ---- */
function lessonView(){ const L=HW.lesson, S=HW.script, sc=S[HW.pos], c=CAST[sc.p]||CAST.tecnico; const secStart=k=>S.findIndex(x=>x.sec===k);
  const ck=HW.chk[HW.pos]||{}; const revealed=HW.rev[HW.pos]; const cheer = ck.ok || revealed;
  const il = illus(sc.cena);
  let extra="";
  if(sc.chk){ extra += `<div class="chk">${sc.chk.opcoes.map((o,i)=>`<button class="chkb ${ck.ok&&i===sc.chk.certa?"ok":""} ${(ck.wrong||[]).includes(i)?"no":""}" data-act="chk" data-arg="${i}" ${ck.ok||(ck.wrong||[]).includes(i)?"disabled":""}>${esc(o)}</button>`).join("")}</div>`; }
  if(sc.reveal){ extra += revealed ? `<div class="ansl" id="ansK"><b>✅ Resposta</b>${kara(sc.resp||"Confira com o adulto.")}${sc.escrever?`<div class="small">✏️ No caderno: ${esc(sc.escrever)}</div>`:""}</div>`
      : `<button class="btn gold wide" data-act="lzReveal">👀 Ver resposta</button>`; }
  if(sc.treino){ extra += `${L.score?`<div class="lz-note">Último placar desta lição: ${L.score.c} de ${L.score.t}.</div>`:""}<button class="btn go wide" data-act="hwTrain" ${L.treino.length?"":"disabled"}>▶ Começar treino</button>${AI.sample?`<button class="btn wide" data-act="trainLesson" data-arg="${L.id}">✨ Mais exercícios parecidos</button>`:""}`; }
  return `<div class="lz stack">
   <div class="row" style="justify-content:space-between"><button class="btn" data-act="hwBack" style="min-height:44px;padding:8px 14px">◀ Lições</button><span class="lz-chip">${esc(SUBJ[L.subj]?.i||"")} ${esc(L.tema)}</span></div>
   <div class="secs">${SECS.map((s,k)=>{ const st=secStart(k); return `<button data-act="lzGo" data-arg="${st}" ${sc.sec===k?'aria-current="step"':''} class="${sc.sec>k?"done":""}" ${st<0?"disabled":""}>${s}</button>`; }).join("")}</div>
   <div class="pips" aria-label="Cena ${HW.pos+1} de ${S.length}">${S.map((x,i)=>`<i class="${i<HW.pos?"d":i===HW.pos?"c":""}"></i>`).join("")}</div>
   ${sc.tag?`<div class="lz-tag">${esc(sc.tag)}</div>`:""}
   <div class="stage" data-key="${HW.pos}"><div class="actor-wrap pop"><div class="actor ${cheer?"cheer":""}" id="actor">${charSVG(sc.p)}</div><div class="nametag">${esc(c.n)}</div></div>
    <div class="bubble pop2"><div class="who">${esc(c.n)}<button class="spk sm" data-act="sceneSay" aria-label="Ouvir de novo">🔊</button></div>${kara(sc.f).replace('class="k ','id="bubbleK" class="k ')}</div></div>
   ${il?`<div class="board">${il}</div>`:""}
   ${extra}
   <div class="ctrl"><button class="btn" data-act="lzPrev" ${HW.pos?"":"disabled"} aria-label="Voltar">◀</button><button class="btn" data-act="sceneSay" aria-label="Repetir">🔁</button>
    ${HW.pos<S.length-1?`<button class="btn go" id="nextBtn" data-act="lzNext">Continuar ▶</button>`:`<span></span>`}</div>
  </div>`; }
function sceneSpeak(){ const b=$("#bubbleK"), a=$("#actor"); if(!b) return; a?.classList.add("talking");
  speak(b.dataset.say, b).then(()=>{ a?.classList.remove("talking"); $("#nextBtn")?.classList.add("pulse"); }); }
function lzGo(i){ HW.pos=clamp(+i,0,HW.script.length-1); HW.count=0; go("hw",true); sceneSpeak(); }
function chk(i){ const sc=HW.script[HW.pos]; const ck=HW.chk[HW.pos]=HW.chk[HW.pos]||{wrong:[]}; if(ck.ok) return; i=+i;
  if(i===sc.chk.certa){ ck.ok=true; if(sc.reveal) HW.rev[HW.pos]=true; const first=!ck.wrong.length; addXP(first?5:2); addCoins(1); recordAnswer(HW.lesson.subj, HW.lesson.tema, first); save(); renderHUD();
    go("hw",true); SFX.ok(); celebrate(false); const a=$("#actor"); a?.classList.add("talking"); speak(pick(ST().praise)+(sc.reveal&&sc.resp?" A resposta é: "+sc.resp:"")).then(()=>a?.classList.remove("talking"));
  }
  else { ck.wrong.push(i); SFX.soft(); go("hw",true); talk(sc.p, pick(ST().retry)); } }
function lzReveal(){ HW.rev[HW.pos]=true; go("hw",true); SFX.ok(); celebrate(false); const k=$("#ansK .k"); const a=$("#actor"); a?.classList.add("talking"); speak("A resposta é: "+k.dataset.say, k).then(()=>a?.classList.remove("talking")); }
function hwTrain(){ const L=HW.lesson; startQuiz({kind:"lição", cast:"meia", subj:L.subj, topic:L.tema, chip:`📸 ${L.tema}`, qs:L.treino.map(q=>({...q})), back:"hw", again:hwTrain,
  onDone:({c,scored})=>{ ensureDaily(); const first=!state.daily.hw; state.daily.hw=true; if(!L.done){ L.done=true; state.hwCount++; } L.score={c,t:scored};
    if(first){ addCoins(20); return "Missão da lição de casa completa! Mais 20 moedas."; } return ""; } }); }

/* ============ TROFÉUS / LIGA / LOJA ============ */
let TROPHY_TAB="ach";
function weekStart(d=new Date()){ const x=new Date(d); const wd=(x.getDay()+6)%7; x.setHours(0,0,0,0); x.setDate(x.getDate()-wd); return x; }
function weekXP(start){ let s=0; for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(d.getDate()+i); s+=state.days[dkey(d)]?.xp||0; } return s; }
function league(){ const ws=weekStart(); const mine=weekXP(ws);
  let past=[]; for(let w=1;w<=4;w++){ const d=new Date(ws); d.setDate(d.getDate()-7*w); past.push(weekXP(d)); } const avg = Math.max(140, past.filter(Boolean).reduce((a,b)=>a+b,0)/(past.filter(Boolean).length||1));
  const rnd = seeded(+dkey(ws).replace(/-/g,"")); const prog = Math.min(1, ((Date.now()-ws.getTime())/864e5 + .3)/7);
  const rows = TEAMS.map(n=>({n, p:Math.round(avg*(.45+rnd()*.9)*prog)})); rows.push({n:state.name, p:mine, me:true});
  rows.sort((a,b)=>b.p-a.p || (a.me?-1:1)); return rows; }

   <span>A página usa as vozes instaladas no aparelho. As vozes naturais soam bem mais humanas. Para conseguir uma:</span>
   <span>💻 <b>Computador Windows:</b> abra a página no Microsoft Edge. Ele traz as vozes Francisca, Thalita e Antonio (Natural), as mais humanas em português.</span>
   <span>🤖 <b>Android:</b> use o Chrome. Em Configurações › Sistema › Idiomas › Saída de texto para fala, escolha Serviços de fala do Google, toque na engrenagem › Instalar dados de voz › Português (Brasil) e baixe uma voz em alta qualidade.</span>
   <span>🍎 <b>iPhone, iPad ou Mac:</b> em Ajustes › Acessibilidade › Conteúdo Falado › Vozes › Português (Brasil), baixe a voz Luciana (Melhorada ou Premium). Depois feche e abra a página de novo.</span>
   <span>Dica: depois de trocar, escolha a voz acima, toque em Testar voz e ajuste a velocidade. Entre 0,90 e 1,00 costuma soar mais natural.</span></div>`; }
function gSave(){ const sv=state.settings; state.name=($("#s_name").value.trim()||"Craque").slice(0,20); state.ano=+$("#s_ano").value; state.settings.num=clamp(+$("#s_num").value||10,1,99); state.settings.skin=$("#s_skin").value;
  sv.maxLvl=+$("#s_max").value; sv.style=$("#s_style").value; sv.goalTrain=+$("#s_goal").value; state.read.lvl=+$("#s_rl").value; sv.rate=+$("#s_rate").value;
  sv.narr=$("#s_narr").checked; sv.sfx=$("#s_sfx").checked; sv.calm=$("#s_calm").checked; const vs=$("#s_voice"); if(vs){ sv.voice=vs.value; pickVoice(); }
  Object.values(state.subj).forEach(s=>{ if(s.lvl>sv.maxLvl) s.lvl=sv.maxLvl; });
  applyCalm(); save(); renderHUD(); toast("Ajustes salvos"); }

/* ============ ações ============ */
const ACT = {
  tab:a=>{ if(a==="hw" && HW.stage==="lesson" && cur==="hw"){ HW.stage="upload"; } go(a); },
  sayIntro:()=>{ const k=$("#view .k[data-auto]"); sayEl(k); },
  sayFirstK:(a,el)=>{ const box=el.closest(".slide,.board,.qcard,.card")||$("#view"); sayEl(box.querySelector(".k")); },
  sayIn:a=>{ const el=document.getElementById(a); sayEl(el?.querySelector(".k")||el); },
  closeModal, guardian, chest:()=>{ ensureDaily(); if(state.daily.chest) return; state.daily.chest=true; state.chests=(state.chests||0)+1; addCoins(50); addXP(30); checkAch(); save(); SFX.win(); celebrate(true);
    modal(`<div class="big">🎁</div><h2>Baú do dia!</h2>${kara("Você completou todas as missões de hoje. Ganhou 50 moedas e 30 pontos de experiência!")}<button class="btn go wide" data-act="closeModal">Pegar prêmio ▶</button>`, true); go("home",true); },
  openSubj, trainBank, trainAI:k=>trainAI(k),
  trainLesson:id=>{ const l=state.lessons.find(x=>x.id===id) || (HW.lesson?.id===id?HW.lesson:null); if(l) trainAI(l.subj, l); },
  readStart,
  opt:qOpt, qConfirm, qNext, qReplay:sayQ, sayFb:()=>sayFirst(".fb .k"), learnSay,
  sayRead:()=>{ const q=QZ?.qs[QZ.i]; if(q?.read) speak(q.read.toLowerCase(), null); },
  tile, tileUndo,
  qExit:()=>{ const b=QZ?.back||"home"; QZ=null; go(b); },
  again:()=>{ const f=QZ?.again; QZ=null; f&&f(); },
  cancelLoad:()=>{ LOADCTL?.abort(); },
  hwAnalyze, hwTrain, hwBack:()=>{ HW.stage="upload"; go("hw",true); },
  openLesson:id=>{ const l=state.lessons.find(x=>x.id===id); if(l) openLessonObj(l); },
  lzNext:()=>lzGo(HW.pos+1), lzPrev:()=>lzGo(HW.pos-1), lzGo, sceneSay:()=>sceneSpeak(), chk, lzReveal,
  countIt:(a,el)=>{ if(el.classList.contains("on")) return; HW.count++; el.dataset.c=HW.count; el.classList.add("on"); SFX.tap(); speak(String(HW.count)); },
  ilReveal:(a,el)=>{ el.textContent=a; el.classList.add("shown"); SFX.ok(); speak("Resultado: "+a); },
  sayTxt:a=>speak(a),
  meet:(id,el)=>{ const ac=el.querySelector(".actor"); ac?.classList.add("talking"); speak(MEET[id]).then(()=>ac?.classList.remove("talking")); },
  ttab:a=>{ TROPHY_TAB=a; go("trophy"); },
  sayAch:id=>{ const a=ACH.find(x=>x.id===id); speak(`${a.n}. ${a.d}. ${state.ach.includes(id)?"Conquistado!":"Ainda não conquistado."}`); },
  sayLeague:()=>{ const rows=league(); const pos=rows.findIndex(r=>r.me)+1; const lead=rows[0]; speak(`Você está em ${pos}º lugar, com ${rows[pos-1].p} pontos. ${pos===1?"Você é o líder da liga!":`O líder é ${lead.n}, com ${lead.p} pontos. Continue treinando para subir!`}`); },
  buy:id=>{ const s=SHOP.find(x=>x.id===id); if(!s||state.owned.includes(id)) return; if(state.coins<s.p){ speak("Faltam moedas. Faça mais treinos!"); return; }
    state.coins-=s.p; state.owned.push(id); state.buys++; equip(id); SFX.coin(); celebrate(false); speak(`Você comprou ${s.n}!`); checkAch(); save(); go("trophy",true); },
  equip:id=>{ equip(id); save(); go("trophy",true); const s=SHOP.find(x=>x.id===id); speak(`Agora você usa ${s.n}.`); },
  pin:pinKey, pinForgot, pinReset,
  copyLink:async()=>{ const i=$("#shareLink"); try{ await navigator.clipboard.writeText(i.value); toast("Link copiado"); }catch(e){ i.select(); toast("Selecione e copie o link"); } },
  gsub:a=>{ G.sub=a; go("guardian",true); }, gExit:()=>{ G.open=false; go("home"); }, gSave, gAI,
  gTestVoice:()=>{ state.settings.rate=+$("#s_rate").value; state.settings.style=$("#s_style").value; const vs=$("#s_voice"); if(vs){ state.settings.voice=vs.value; pickVoice(); } speak(state.settings.style==="locutor"?`Bola rolando na Arena Craque! ${state.name} domina, avança e... gooool! Que golaço!`:`Oi, ${state.name}! Essa é a voz do narrador da Arena Craque.`); },
  gNewPin:()=>{ G.open=false; G.mode="create"; G.entry=""; state.pin=null; save(); renderGate(); },
  gResetAsk:()=>{ $("#gReset").innerHTML=`<div class="note warnnote stack">Isto apaga pontos, moedas, histórico e lições salvas. Não dá para desfazer.<div class="row"><button class="btn" data-act="gResetYes">Sim, zerar tudo</button><button class="btn ghost" data-act="gResetNo">Cancelar</button></div></div>`; },
  gResetNo:()=>{ $("#gReset").innerHTML=""; },
  gResetYes:()=>{ const keep={pin:state.pin, settings:state.settings, name:state.name, ano:state.ano}; state=merge(DEF(),keep); save(); renderHUD(); toast("Progresso zerado"); go("guardian",true); }
};
function equip(id){ const s=SHOP.find(x=>x.id===id); if(!s||!state.owned.includes(id)) return; if(s.t==="kit") state.kit=id; else if(s.t==="av") state.avatar=id; else state.celeb=id; renderHUD(); }

document.addEventListener("click", e=>{ const el=e.target.closest("[data-act]"); if(!el || el.disabled) return;
  const act=el.dataset.act, fn=ACT[act]; if(!fn) return; if(el.tagName!=="LABEL") e.preventDefault();
  try{ fn(el.dataset.arg, el, el.dataset.arg2); }catch(err){ console.error(err); }
  if(state.settings.narr && el.dataset.label && !TTS_BUSY_ACTS.includes(act)) speak(el.dataset.label);
  if(cur==="hw") bindHW(); });
/* ações que já falam sozinhas */
const TTS_BUSY_ACTS = ["tab","lzNext","lzPrev","lzGo","sceneSay","chk","lzReveal","countIt","ilReveal","sayTxt","meet","openLesson","trainBank","trainAI","trainLesson","readStart","hwAnalyze","ttab","openSubj","exNext","exReveal","hwBack"];
ACT.trainAI = (k,el,lid)=>{ const l = lid ? state.lessons.find(x=>x.id===lid) : null; trainAI(k, l); };
ACT.hwAnalyze = hwAnalyze;

/* ============ início ============ */
const _go = go;
go = function(v,s){ _go(v,s); if(v==="hw") bindHW(); };
function migrateMe(){ if(!state.owned.includes("me")){ state.owned.unshift("me"); if(state.avatar==="⚽") state.avatar="me"; } }
migrateMe(); ensureDaily(); applyCalm(); renderHUD(); go("home", true);
initDB(); initAI();
</script>
